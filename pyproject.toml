[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "growatt-inverter-info"
version = "0.1.0"
description = "Consolidated Growatt Modbus register specification and source corpus"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
growatt-build-spec = "tools.build_spec:main"
growatt-validate-spec = "tools.validate_spec:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.setuptools]
packages = ["tools"]
